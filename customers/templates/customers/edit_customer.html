{% extends "base.html" %}

{% block content %}

<div class="page-container">

    <div class="page-header">
        <div>
            <h1>Edit Customer</h1>
            <p>Update customer information</p>
        </div>

        <a
            href="{% url 'customer_detail' customer.id %}"
            class="back-btn"
        >
            ← Back
        </a>
    </div>


    <div class="edit-card">

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    value="{{ customer.phone }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                >{{ customer.address }}</textarea>

            </div>


            <div class="form-actions">

                <a
                    href="{% url 'customer_detail' customer.id %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<style>

.page-container {
    max-width: 900px;
    margin: 0 auto;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h1 {
    margin: 0;
    font-size: 28px;
}

.page-header p {
    margin: 6px 0 0;
    color: #777;
}

.back-btn {
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    background: #f3f3f3;
    color: #333;
}

.edit-card {
    background: white;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input,
.form-group textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #555;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 25px;
}

.cancel-btn,
.save-btn {
    padding: 11px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
}

.cancel-btn {
    background: #f1f1f1;
    color: #333;
}

.save-btn {
    border: none;
    background: #222;
    color: white;
}

.error-message {
    margin-bottom: 20px;
    padding: 12px 15px;
    border-radius: 8px;
    background: #ffecec;
    color: #b00020;
}


@media (max-width: 600px) {

    .page-header {
        align-items: flex-start;
        gap: 15px;
    }

    .edit-card {
        padding: 20px;
    }

    .form-actions {
        flex-direction: column;
    }

    .cancel-btn,
    .save-btn {
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }

}

</style>

{% endblock %}
